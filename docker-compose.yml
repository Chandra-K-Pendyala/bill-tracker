services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    ports:
      - "${APP_PORT:-8008}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/media
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  uploads:
