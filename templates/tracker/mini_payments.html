<div class="mini-list">{% for p in items %}<div class="mini-item"><a href="{% url 'payment_edit' p.pk %}?next={{ request.get_full_path|urlencode }}"><div><strong>{{ p.bill_account.provider.name }}</strong><span>{{ p.bill_account.property.name|default:p.bill_account.service_address }} · due {{ p.due_date|date:"M j" }}</span></div><b>${{ p.balance|floatformat:"2g" }}</b></a><form method="post" action="{% url 'payment_mark_paid' p.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="button small">Mark paid</button></form></div>{% empty %}<p class="empty">{{ empty_text }}</p>{% endfor %}</div>
