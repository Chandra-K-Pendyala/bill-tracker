{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Settings</h1><p class="muted">Profile and account security.</p></div></div><section class="settings-grid"><form method="post" class="card stack">{% csrf_token %}<h2>Profile</h2>{% for field in profile_form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}<button class="button primary" name="save_profile">Save profile</button></form><form method="post" class="card stack">{% csrf_token %}<h2>Change password</h2>{% for field in password_form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</label>{% endfor %}<button class="button primary" name="change_password">Change password</button></form></section>{% endblock %}
