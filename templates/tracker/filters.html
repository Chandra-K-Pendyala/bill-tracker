<form class="filter-card" method="get"><label>Month<select name="month"><option value="">All</option>{% for m in "123456789101112"|make_list %}{% endfor %}<option value="1" {% if request.GET.month == '1' %}selected{% endif %}>January</option><option value="2" {% if request.GET.month == '2' %}selected{% endif %}>February</option><option value="3" {% if request.GET.month == '3' %}selected{% endif %}>March</option><option value="4" {% if request.GET.month == '4' %}selected{% endif %}>April</option><option value="5" {% if request.GET.month == '5' %}selected{% endif %}>May</option><option value="6" {% if request.GET.month == '6' %}selected{% endif %}>June</option><option value="7" {% if request.GET.month == '7' %}selected{% endif %}>July</option><option value="8" {% if request.GET.month == '8' %}selected{% endif %}>August</option><option value="9" {% if request.GET.month == '9' %}selected{% endif %}>September</option><option value="10" {% if request.GET.month == '10' %}selected{% endif %}>October</option><option value="11" {% if request.GET.month == '11' %}selected{% endif %}>November</option><option value="12" {% if request.GET.month == '12' %}selected{% endif %}>December</option></select></label>
<label>Year<select name="year"><option value="">All</option>{% for y in years %}<option {% if request.GET.year == y|stringformat:'s' %}selected{% endif %}>{{ y }}</option>{% endfor %}</select></label>
<label>Provider<select name="provider"><option value="">All</option>{% for p in providers %}<option value="{{ p.pk }}" {% if request.GET.provider == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></label>
<label>Category<select name="category"><option value="">All</option>{% for value,label in categories %}<option value="{{ value }}" {% if request.GET.category == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Status<select name="status"><option value="">All</option><option value="paid" {% if request.GET.status == 'paid' %}selected{% endif %}>Paid</option><option value="unpaid" {% if request.GET.status == 'unpaid' %}selected{% endif %}>Unpaid</option><option value="partially_paid" {% if request.GET.status == 'partially_paid' %}selected{% endif %}>Partially paid</option><option value="overdue" {% if request.GET.status == 'overdue' %}selected{% endif %}>Overdue</option></select></label>
<label>Province<input name="province" maxlength="2" value="{{ request.GET.province }}" placeholder="ON"></label><label>Address<input name="address" value="{{ request.GET.address }}" placeholder="Contains…"></label><div class="filter-actions"><button class="button primary">Apply</button><a class="button secondary" href="{{ request.path }}">Clear</a></div></form>
